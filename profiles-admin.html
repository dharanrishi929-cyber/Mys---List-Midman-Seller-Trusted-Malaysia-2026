<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Profiles - MYS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="admin-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="admin-logo">

            MYS

            <span>
                SYNDICATE
            </span>

        </div>


        <div class="admin-role">
            ADMIN PANEL
        </div>


        <nav class="admin-nav">

            <a href="admin.html">
                Dashboard
            </a>

            <a
                href="profiles-admin.html"
                class="active"
            >
                Profiles
            </a>

            <a href="#">
                Reviews
            </a>

            <a href="#">
                Audit Logs
            </a>

            <a href="#">
                Admin Management
            </a>

            <a href="#">
                Settings
            </a>

        </nav>


        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </aside>



    <!-- MAIN -->

    <main class="admin-main">


        <div class="admin-top">

            <div>

                <small>
                    ADMIN PANEL
                </small>

                <h1>
                    Manage Profiles
                </h1>

            </div>


            <button
                class="login-btn"
                id="addProfileBtn"
            >
                + Add Profile
            </button>

        </div>



        <!-- ADD PROFILE FORM -->

        <div
            id="addProfileForm"
            class="profile-form"
            style="display: none;"
        >


            <h2>
                Add New Profile
            </h2>



            <!-- PROFILE IMAGE -->

            <label
                for="newProfileImage"
            >
                Profile Image
            </label>


            <input
                type="file"
                id="newProfileImage"
                accept="image/*"
            >


            <!-- IMAGE PREVIEW -->

            <div
                id="profileImagePreview"
                style="
                    display:none;
                    margin-top:15px;
                    text-align:center;
                "
            >

                <img
                    id="previewImage"
                    src=""
                    alt="Profile Preview"
                    style="
                        width:100px;
                        height:100px;
                        object-fit:cover;
                        border-radius:50%;
                        border:2px solid rgba(77,163,255,0.5);
                    "
                >

            </div>



            <!-- USERNAME -->

            <input
                type="text"
                id="newUsername"
                placeholder="Username"
            >



            <!-- ROLE -->

            <select id="newRole">

                <option value="SELLER">
                    Seller
                </option>

                <option value="MIDMAN">
                    Midman
                </option>

            </select>



            <!-- WHATSAPP -->

            <input
                type="text"
                id="newWhatsapp"
                placeholder="WhatsApp number"
            >



            <!-- TRUST -->

            <input
                type="text"
                id="newTrust"
                placeholder="Trust status"
                value="Trusted"
            >



            <!-- DESCRIPTION -->

            <textarea
                id="newDescription"
                placeholder="Description"
            ></textarea>



            <!-- VERIFIED -->

            <label>

                <input
                    type="checkbox"
                    id="newVerified"
                >

                Verified

            </label>



            <!-- FEATURED -->

            <label>

                <input
                    type="checkbox"
                    id="newFeatured"
                >

                Featured

            </label>



            <!-- ACTIONS -->

            <div class="form-actions">


                <button
                    id="saveProfileBtn"
                >
                    Save Profile
                </button>


                <button
                    id="cancelProfileBtn"
                    type="button"
                >
                    Cancel
                </button>


            </div>


        </div>



        <!-- PROFILES -->

        <div
            id="profilesAdminGrid"
            class="admin-profile-grid"
        >

            <p class="loading">
                Loading profiles...
            </p>

        </div>


    </main>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="supabase.js"></script>

<script src="profiles-admin.js"></script>


<script>

    /*
     * IMAGE PREVIEW ONLY
     * Upload functionality akan dibuat
     * dalam profiles-admin.js selepas ini.
     */

    const imageInput =
        document.getElementById(
            "newProfileImage"
        );

    const previewBox =
        document.getElementById(
            "profileImagePreview"
        );

    const previewImage =
        document.getElementById(
            "previewImage"
        );


    if (imageInput) {

        imageInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files[0];


                if (!file) {

                    previewBox.style.display =
                        "none";

                    previewImage.src =
                        "";

                    return;
                }


                if (!file.type.startsWith("image/")) {

                    alert(
                        "Please select an image file."
                    );

                    this.value =
                        "";

                    return;
                }


                const reader =
                    new FileReader();


                reader.onload =
                    function (event) {

                        previewImage.src =
                            event.target.result;

                        previewBox.style.display =
                            "block";

                    };


                reader.readAsDataURL(file);

            }
        );

    }

</script>


</body>

</html>
